<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Chess Board</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s;
        }
        
        #splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .splash-content {
            text-align: center;
            color: white;
            max-width: 80%;
        }
        
        .splash-content h1 {
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .splash-content p {
            font-size: 16px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        #start-ar-button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        #start-ar-button:hover {
            transform: scale(1.05);
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1500;
        }
        
        #loading-screen.active {
            display: flex;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 18px;
        }
        
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            max-width: 90%;
            z-index: 100;
            display: none;
        }
        
        #instructions.visible {
            display: block;
        }
        
        #placement-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            margin: -30px 0 0 -30px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            z-index: 50;
            pointer-events: none;
            display: none;
        }
        
        #placement-indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            margin: -5px 0 0 -5px;
        }
        
        #placement-indicator.visible {
            display: block;
            animation: pulse-ring 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse-ring {
            0%, 100% { 
                transform: scale(1);
                opacity: 0.8;
            }
            50% { 
                transform: scale(1.2);
                opacity: 0.4;
            }
        }
        
        #place-button {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #44ff44;
            color: black;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 20px rgba(68, 255, 68, 0.4);
        }
        
        #place-button.visible {
            display: block;
            animation: bounce 1s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }
        
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        
        #controls.visible {
            display: flex;
        }
        
        .control-button {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 2px solid white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            min-width: 100px;
        }
        
        .control-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="splash-screen">
        <div class="splash-content">
            <h1>🎯 Scacchiera AR</h1>
            <p>Posiziona la scacchiera su una superficie reale</p>
            <button id="start-ar-button">Inizia Esperienza AR</button>
        </div>
    </div>
    
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Inizializzazione camera AR...</div>
    </div>
    
    <div id="instructions">
        Muovi il dispositivo per rilevare le superfici, poi tocca per posizionare la scacchiera
    </div>
    
    <div id="placement-indicator"></div>
    
    <button id="place-button">Posiziona Scacchiera</button>
    
    <div id="controls">
        <button class="control-button" onclick="resetPosition()">Riposiziona</button>
        <button class="control-button" onclick="toggleRotation()">Ruota</button>
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="colorManagement: true; physicallyCorrectLights: true; logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="chessModel" src="assets/chess_scene.glb"></a-asset-item>
        </a-assets>

        <a-camera gps-camera rotation-reader look-controls="enabled: false"></a-camera>

        <a-entity id="chess-container" visible="false">
            <a-gltf-model
                id="chess-scene"
                src="#chessModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="0.5 0.5 0.5"
                animation-mixer="clip: *">
            </a-gltf-model>
            
            <a-light type="ambient" intensity="0.6"></a-light>
            <a-light type="directional" position="2 4 2" intensity="0.8" cast-shadow="true"></a-light>
            <a-light type="point" position="0 2 0" intensity="0.4"></a-light>
        </a-entity>
    </a-scene>

    <script>
        let arReady = false;
        let objectPlaced = false;
        let isRotating = false;
        
        const splashScreen = document.getElementById('splash-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const instructions = document.getElementById('instructions');
        const placementIndicator = document.getElementById('placement-indicator');
        const placeButton = document.getElementById('place-button');
        const controls = document.getElementById('controls');
        const startButton = document.getElementById('start-ar-button');
        const chessContainer = document.getElementById('chess-container');
        const scene = document.querySelector('a-scene');
        const camera = document.querySelector('a-camera');
        
        // Avvio AR
        startButton.addEventListener('click', async () => {
            splashScreen.classList.add('hidden');
            loadingScreen.classList.add('active');
            
            try {
                // Richiedi permessi camera
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                
                // Permesso ottenuto
                console.log('Permesso camera ottenuto');
                
                setTimeout(() => {
                    loadingScreen.classList.remove('active');
                    setTimeout(() => splashScreen.style.display = 'none', 500);
                    instructions.classList.add('visible');
                    placementIndicator.classList.add('visible');
                    placeButton.classList.add('visible');
                    arReady = true;
                }, 2000);
                
            } catch (error) {
                console.error('Errore accesso camera:', error);
                loadingScreen.querySelector('.loading-text').textContent = 
                    'Errore: permesso camera negato';
            }
        });
        
        // Posizionamento oggetto
        placeButton.addEventListener('click', () => {
            if (!arReady || objectPlaced) return;
            
            const cameraPosition = camera.getAttribute('position');
            const cameraRotation = camera.getAttribute('rotation');
            
            // Calcola posizione davanti alla camera
            const distance = 1.5;
            const radians = (cameraRotation.y * Math.PI) / 180;
            
            const x = cameraPosition.x - Math.sin(radians) * distance;
            const y = cameraPosition.y - 0.5;
            const z = cameraPosition.z - Math.cos(radians) * distance;
            
            chessContainer.setAttribute('position', `${x} ${y} ${z}`);
            chessContainer.setAttribute('rotation', `0 ${cameraRotation.y} 0`);
            chessContainer.setAttribute('visible', 'true');
            
            objectPlaced = true;
            placeButton.textContent = 'Scacchiera Posizionata!';
            placeButton.style.background = '#ffaa00';
            
            setTimeout(() => {
                placeButton.classList.remove('visible');
                placementIndicator.classList.remove('visible');
                instructions.textContent = 'Usa i controlli per regolare la posizione';
                controls.classList.add('visible');
            }, 1500);
        });
        
        // Reset posizione
        window.resetPosition = () => {
            objectPlaced = false;
            chessContainer.setAttribute('visible', 'false');
            placeButton.textContent = 'Posiziona Scacchiera';
            placeButton.style.background = '#44ff44';
            placeButton.classList.add('visible');
            placementIndicator.classList.add('visible');
            instructions.textContent = 'Muovi il dispositivo e tocca per posizionare';
        };
        
        // Toggle rotazione
        window.toggleRotation = () => {
            isRotating = !isRotating;
            const chessModel = document.getElementById('chess-scene');
            
            if (isRotating) {
                chessModel.setAttribute('animation', {
                    property: 'rotation',
                    to: '0 360 0',
                    loop: true,
                    dur: 10000,
                    easing: 'linear'
                });
                document.querySelector('#controls .control-button:last-child').textContent = 'Stop Rotazione';
            } else {
                chessModel.removeAttribute('animation');
                document.querySelector('#controls .control-button:last-child').textContent = 'Ruota';
            }
        };
        
        // Gestione errori caricamento modello
        scene.addEventListener('loaded', () => {
            console.log('Scena AR caricata');
        });
        
        window.addEventListener('error', (e) => {
            if (e.message.includes('chess_scene.glb')) {
                console.error('Errore caricamento modello 3D');
                instructions.textContent = 'Errore: verifica il path del file GLB';
                instructions.style.background = 'rgba(255, 68, 68, 0.9)';
            }
        });
        
        console.log('Sistema AR inizializzato. In attesa di avvio...');
    </script>
</body>
</html>
