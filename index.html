<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Chess Board</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 18px;
        }
        
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            max-width: 90%;
            z-index: 100;
        }
        
        #marker-status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            background: #ff4444;
        }
        
        .status-indicator.active {
            background: #44ff44;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        #marker-generator {
            position: fixed;
            top: 70px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
        }
        
        #marker-generator button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            width: 100%;
        }
        
        #marker-generator button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Caricamento AR...</div>
    </div>
    
    <div id="marker-status">
        <span class="status-indicator" id="status-dot"></span>
        <span id="status-text">Cerca il marker</span>
    </div>
    
    <div id="instructions">
        Punta la fotocamera verso il marker per visualizzare la scacchiera AR
    </div>
    
    <div id="marker-generator">
        <div style="font-size: 12px; margin-bottom: 8px;">Marker QR Code</div>
        <canvas id="marker-canvas" width="200" height="200" style="border: 2px solid white; border-radius: 5px;"></canvas>
        <button onclick="downloadMarker()">Scarica Marker</button>
    </div>

    <a-scene
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
        color-space="sRGB"
        embedded
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="chessModel" src="assets/chess_scene.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model
                id="chess-scene"
                src="#chessModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
                animation-mixer="clip: *"
                visible="true">
            </a-gltf-model>
            
            <!-- Luci per illuminare la scena -->
            <a-light type="ambient" intensity="0.5"></a-light>
            <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>
            <a-light type="point" position="0 1 0" intensity="0.3"></a-light>
        </a-entity>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const loadingScreen = document.getElementById('loading-screen');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        
        // Genera un marker semplice
        function generateMarker() {
            const canvas = document.getElementById('marker-canvas');
            const ctx = canvas.getContext('2d');
            const size = 200;
            
            // Sfondo bianco
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, size, size);
            
            // Bordo nero
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, size, 20);
            ctx.fillRect(0, 0, 20, size);
            ctx.fillRect(size-20, 0, 20, size);
            ctx.fillRect(0, size-20, size, 20);
            
            // Pattern centrale (QR-like)
            const patterns = [
                [30, 30, 40, 40],
                [130, 30, 40, 40],
                [30, 130, 40, 40],
                [80, 80, 40, 40],
                [50, 80, 20, 20],
                [80, 50, 20, 20],
                [110, 80, 20, 20],
                [80, 110, 20, 20]
            ];
            
            patterns.forEach(([x, y, w, h]) => {
                ctx.fillRect(x, y, w, h);
            });
        }
        
        function downloadMarker() {
            const canvas = document.getElementById('marker-canvas');
            const link = document.createElement('a');
            link.download = 'ar-marker.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Inizializza il marker canvas
        generateMarker();
        
        // Gestione eventi AR
        sceneEl.addEventListener('loaded', () => {
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
            }, 1000);
            
            const arSystem = sceneEl.systems['mindar-image-system'];
            arSystem.start();
        });
        
        // Tracciamento del marker
        const target = document.querySelector('[mindar-image-target]');
        
        target.addEventListener('targetFound', () => {
            statusDot.classList.add('active');
            statusText.textContent = 'Marker rilevato!';
            console.log('Marker trovato');
        });
        
        target.addEventListener('targetLost', () => {
            statusDot.classList.remove('active');
            statusText.textContent = 'Cerca il marker';
            console.log('Marker perso');
        });
        
        // Gestione errori
        window.addEventListener('error', (e) => {
            console.error('Errore:', e.message);
            if (e.message.includes('assets/chess_scene.glb')) {
                statusText.textContent = 'Errore caricamento modello';
            }
        });
        
        // Debug info
        console.log('AR Experience inizializzata');
        console.log('Assicurati che il file assets/chess_scene.glb sia accessibile');
    </script>
</body>
</html>
