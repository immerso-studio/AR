<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Chess Board</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 18px;
            text-align: center;
            padding: 0 20px;
        }
        
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 14px;
            text-align: center;
            max-width: 85%;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        #surface-status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            background: #ff4444;
        }
        
        .status-indicator.searching {
            background: #ffaa00;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .status-indicator.active {
            background: #44ff44;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        
        #controls {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        
        .control-btn {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        
        .control-btn:active {
            transform: scale(0.95);
            background: rgba(102, 126, 234, 0.9);
        }
        
        #reticle {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.7;
        }
        
        #reticle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Inizializzazione AR...<br>Richiesta permessi fotocamera</div>
    </div>
    
    <div id="surface-status">
        <span class="status-indicator searching" id="status-dot"></span>
        <span id="status-text">Cerca una superficie piana</span>
    </div>
    
    <div id="reticle"></div>
    
    <div id="instructions">
        Muovi lentamente il dispositivo per scansionare superfici piane
    </div>
    
    <div id="controls" style="display: none;">
        <button class="control-btn" onclick="placeChessBoard()">Posiziona Scacchiera</button>
        <button class="control-btn" onclick="resetPosition()">Reset</button>
    </div>

    <a-scene
        webxr="requiredFeatures: hit-test,local-floor;optionalFeatures: dom-overlay,dom-overlay-for-handheld-ar;"
        dom-overlay="root: body;"
        renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false">
        
        <a-assets>
            <a-asset-item id="chessModel" src="assets/chess_scene.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Scacchiera AR -->
        <a-entity id="chess-container" visible="false">
            <a-gltf-model
                id="chess-scene"
                src="#chessModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="0.5 0.5 0.5"
                animation-mixer="loop: repeat"
                shadow="cast: true; receive: true">
            </a-gltf-model>
        </a-entity>

        <!-- Luci -->
        <a-light type="ambient" intensity="0.6"></a-light>
        <a-light type="directional" position="2 4 3" intensity="0.8" castShadow="true"></a-light>
        <a-light type="point" position="0 2 0" intensity="0.4"></a-light>
        
        <!-- Piano di riferimento invisibile per hit-test -->
        <a-entity id="reticle-entity" visible="false">
            <a-ring color="#ffffff" radius-inner="0.08" radius-outer="0.1" rotation="-90 0 0" opacity="0.8"></a-ring>
            <a-entity position="0 0.01 0">
                <a-ring color="#4CAF50" radius-inner="0.04" radius-outer="0.05" rotation="-90 0 0" opacity="0.9"></a-ring>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        const loadingScreen = document.getElementById('loading-screen');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const instructions = document.getElementById('instructions');
        const controls = document.getElementById('controls');
        const sceneEl = document.querySelector('a-scene');
        
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let localReferenceSpace = null;
        let surfaceDetected = false;
        let chessPlaced = false;
        
        const chessContainer = document.getElementById('chess-container');
        const reticleEntity = document.getElementById('reticle-entity');
        
        // Inizializzazione scena
        sceneEl.addEventListener('loaded', () => {
            console.log('Scena caricata');
            
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
            }, 1000);
        });
        
        // Gestione sessione WebXR
        sceneEl.addEventListener('enter-vr', () => {
            console.log('Modalità AR attivata');
            const session = sceneEl.xrSession;
            
            if (session) {
                session.addEventListener('end', () => {
                    hitTestSourceRequested = false;
                    hitTestSource = null;
                });
                
                session.requestReferenceSpace('viewer').then((referenceSpace) => {
                    session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                        hitTestSource = source;
                        hitTestSourceRequested = true;
                        console.log('Hit test source inizializzato');
                    });
                });
                
                session.requestReferenceSpace('local-floor').then((referenceSpace) => {
                    localReferenceSpace = referenceSpace;
                });
            }
        });
        
        // Rendering loop per hit-test
        sceneEl.renderer.xr.addEventListener('sessionstart', async (ev) => {
            const session = sceneEl.renderer.xr.getSession();
            
            const viewerSpace = await session.requestReferenceSpace('viewer');
            hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
            
            localReferenceSpace = await session.requestReferenceSpace('local-floor');
        });
        
        sceneEl.addEventListener('render', (ev) => {
            const frame = ev.detail;
            const session = frame.session;
            
            if (!hitTestSource || !localReferenceSpace) return;
            
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            
            if (hitTestResults.length > 0 && !chessPlaced) {
                const hit = hitTestResults[0];
                const pose = hit.getPose(localReferenceSpace);
                
                if (pose) {
                    // Mostra il reticle sulla superficie
                    reticleEntity.setAttribute('visible', true);
                    reticleEntity.object3D.position.set(
                        pose.transform.position.x,
                        pose.transform.position.y,
                        pose.transform.position.z
                    );
                    
                    const rotation = new THREE.Quaternion().setFromRotationMatrix(
                        new THREE.Matrix4().fromArray(pose.transform.matrix)
                    );
                    reticleEntity.object3D.quaternion.copy(rotation);
                    
                    // Aggiorna stato
                    if (!surfaceDetected) {
                        surfaceDetected = true;
                        statusDot.classList.remove('searching');
                        statusDot.classList.add('active');
                        statusText.textContent = 'Superficie rilevata!';
                        instructions.textContent = 'Tocca "Posiziona Scacchiera" per inserire il modello';
                        controls.style.display = 'flex';
                    }
                    
                    // Salva la posizione per il posizionamento
                    window.lastHitPose = pose;
                }
            } else {
                if (!chessPlaced) {
                    reticleEntity.setAttribute('visible', false);
                }
            }
        });
        
        // Funzione per posizionare la scacchiera
        window.placeChessBoard = function() {
            if (window.lastHitPose && !chessPlaced) {
                const pose = window.lastHitPose;
                
                chessContainer.object3D.position.set(
                    pose.transform.position.x,
                    pose.transform.position.y,
                    pose.transform.position.z
                );
                
                const rotation = new THREE.Quaternion().setFromRotationMatrix(
                    new THREE.Matrix4().fromArray(pose.transform.matrix)
                );
                chessContainer.object3D.quaternion.copy(rotation);
                
                chessContainer.setAttribute('visible', true);
                reticleEntity.setAttribute('visible', false);
                
                chessPlaced = true;
                statusText.textContent = 'Scacchiera posizionata';
                instructions.textContent = 'Scacchiera AR attiva!';
                
                console.log('Scacchiera posizionata alle coordinate:', pose.transform.position);
            }
        };
        
        // Reset posizione
        window.resetPosition = function() {
            chessContainer.setAttribute('visible', false);
            reticleEntity.setAttribute('visible', true);
            chessPlaced = false;
            statusText.textContent = 'Superficie rilevata!';
            instructions.textContent = 'Tocca "Posiziona Scacchiera" per inserire il modello';
        };
        
        // Gestione errori
        window.addEventListener('error', (e) => {
            console.error('Errore:', e.message);
            if (e.message.includes('chess_scene.glb')) {
                statusText.textContent = 'Errore caricamento modello';
                instructions.textContent = 'Verifica che assets/chess_scene.glb sia presente';
            }
        });
        
        console.log('AR Surface Detection inizializzata');
    </script>
</body>
</html>
